<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111930" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stormcalmer" />
  <title>Stormcalmer</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="stylesheet" href="assets/style.css" />
  <script defer src="assets/content.js"></script>
  <script defer src="assets/app.js"></script>
  <script defer src="assets/alpine.min.js"></script>
</head>
<body x-data="storm" x-effect="paintSky()" x-cloak>

<!-- ============ IKONY ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-pogodnie" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></symbol>
    <symbol id="i-mgla" viewBox="0 0 24 24"><path d="M4 8h12M7 12h13M3 16h14M9 20h8"/></symbol>
    <symbol id="i-wichura" viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 17h6"/></symbol>
    <symbol id="i-burza" viewBox="0 0 24 24"><path d="M7 15.5a4 4 0 0 1 .4-8A5.5 5.5 0 0 1 18 8.5a3.5 3.5 0 0 1-.5 7"/><path d="M12.5 12l-2.5 4.5h3.5L11 21"/></symbol>
    <symbol id="i-deszcz" viewBox="0 0 24 24"><path d="M7 14a4 4 0 0 1 .4-8A5.5 5.5 0 0 1 18 7a3.5 3.5 0 0 1-.5 7"/><path d="M8.5 17l-1 2.5M12.5 17l-1 2.5M16.5 17l-1 2.5"/></symbol>
    <symbol id="i-dzis" viewBox="0 0 24 24"><path d="M3 17h18M7 17a5 5 0 0 1 10 0M12 6.5v2M5.6 10.4l1.4 1.4M18.4 10.4L17 11.8M6 20.5h12"/></symbol>
    <symbol id="i-nawyki" viewBox="0 0 24 24"><path d="M12 21v-9M12 12c0-4.5 3-7 7.5-7 0 4.5-3 7-7.5 7zM12 14.5c0-3.5-2.2-5.5-6.5-5.5 0 3.5 2.2 5.5 6.5 5.5z"/></symbol>
    <symbol id="i-klimat" viewBox="0 0 24 24"><path d="M2.5 9c3-2.4 6.3 2.4 9.5 0s6.5-2.4 9.5 0M2.5 14c3-2.4 6.3 2.4 9.5 0s6.5-2.4 9.5 0M2.5 19c3-2.4 6.3 2.4 9.5 0s6.5-2.4 9.5 0"/></symbol>
    <symbol id="i-wiecej" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="18.5" cy="12" r=".8"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </defs>
</svg>

<!-- ============ NIEBO I MORZE ============ -->
<div class="sky" aria-hidden="true">
  <div class="sun"></div>
  <div class="fog"><i></i><i></i><i></i></div>
  <div class="rain"></div>
</div>
<div class="sea" aria-hidden="true">
  <div class="wave w3"><svg viewBox="0 0 2880 100" preserveAspectRatio="none"><path d="M0 50Q180 18 360 50T720 50T1080 50T1440 50T1800 50T2160 50T2520 50T2880 50V100H0Z"/></svg></div>
  <div class="wave w2"><svg viewBox="0 0 2880 100" preserveAspectRatio="none"><path d="M0 50Q180 18 360 50T720 50T1080 50T1440 50T1800 50T2160 50T2520 50T2880 50V100H0Z"/></svg></div>
  <div class="wave w1"><svg viewBox="0 0 2880 100" preserveAspectRatio="none"><path d="M0 50Q180 18 360 50T720 50T1080 50T1440 50T1800 50T2160 50T2520 50T2880 50V100H0Z"/></svg></div>
</div>

<!-- ============ INSTALACJA (przed pierwszym rejsem) ============ -->
<template x-if="showInstall && !run">
  <main class="run install">
    <p class="eyebrow">Stormcalmer</p>
    <h1 class="title">Najpierw zakotwicz aplikację na ekranie.</h1>
    <template x-if="isIOS()">
      <div>
        <p class="lede">Na iPhonie i iPadzie dane z karty Safari i z aplikacji na ekranie początkowym są <b>osobne</b>. Jeśli zaczniesz tutaj, po instalacji zaczniesz od zera.</p>
        <ol class="steps-list">
          <li>Stuknij <b>Udostępnij</b> <span class="share-glyph">⎙</span> na dole Safari.</li>
          <li>Wybierz <b>Do ekranu początkowego</b>.</li>
          <li>Otwórz Stormcalmer z nowej ikony. Działa też bez internetu.</li>
        </ol>
      </div>
    </template>
    <template x-if="!isIOS()">
      <p class="lede">Możesz korzystać w przeglądarce albo zainstalować aplikację z menu przeglądarki. Dane zostają tylko na tym urządzeniu.</p>
    </template>
    <button class="cta" @click="skipInstall()"><span x-text="isIOS() ? 'Kontynuuj w Safari' : 'Zaczynamy'"></span><svg class="ic"><use href="#i-arrow"/></svg></button>
  </main>
</template>

<!-- ============ PRZEBIEG KROKÓW (ćwiczenie / rytuał) ============ -->
<template x-if="run">
  <main class="run">
    <header class="run-head">
      <button class="icon-btn" @click="run.done ? (run = null) : back()" aria-label="Wstecz">
        <svg class="ic"><use href="#i-back"/></svg>
      </button>
      <div class="eyebrow" x-text="run?.def.title"></div>
      <button class="icon-btn" @click="cancel()" aria-label="Zamknij">
        <svg class="ic"><use href="#i-close"/></svg>
      </button>
    </header>
    <div class="progress" x-show="run && !run.done"><div :style="`width:${progress()}%`"></div></div>

    <!-- krok -->
    <template x-if="run && !run.done && step()">
      <section class="step" :key="run.i">
        <template x-if="st.type === 'quote'">
          <figure class="quote quote-xl" x-data="{ q: quoteFor(today, ans.weather) }">
            <blockquote x-text="q.t"></blockquote>
            <figcaption><span x-text="q.a"></span> · <span x-text="q.s"></span></figcaption>
            <p class="reflect" x-text="q.q"></p>
          </figure>
        </template>

        <template x-if="st.type !== 'quote'">
          <div>
            <p class="prompt" x-text="stepText('prompt')"></p>
            <p class="hint" x-show="st.hint" x-text="stepText('hint')"></p>
          </div>
        </template>

        <!-- najpierw wybór, pisanie tylko na życzenie -->
        <template x-if="chipsFor().length">
          <div class="chips">
            <template x-for="c in chipsFor()" :key="c.t">
              <button class="chip" :class="{ on: chipOn(c.t), mine: c.mine, starter: isStarter(c.t), long: longChips() }"
                      @click="addChip(c.t)" x-text="c.t"></button>
            </template>
          </div>
        </template>
        <template x-if="isTextStep() && chipsFor().length && !writeOpen">
          <button class="text-btn write-open" @click="openWriting()">✎ własnymi słowami</button>
        </template>

        <template x-if="isTextStep() && writeOpen && st.type === 'text'">
          <input type="text" class="field" x-model="ans[st.id]" @keydown.enter="next()" />
        </template>
        <template x-if="isTextStep() && writeOpen && st.type !== 'text'">
          <textarea class="field lined" rows="3" x-model="ans[st.id]"></textarea>
        </template>
        <template x-if="isTextStep() && writeOpen">
          <p class="dictate">Wolisz mówić? Mikrofon na klawiaturze zamieni głos w tekst.</p>
        </template>

        <template x-if="st.type === 'scale'">
          <div class="scale">
            <div class="scale-val" x-text="ans[st.id]"></div>
            <input type="range" min="0" max="10" step="1" x-model.number="ans[st.id]" />
            <div class="scale-ends"><span>cisza</span><span>sztorm</span></div>
          </div>
        </template>

        <template x-if="st.type === 'choice'">
          <div class="choices">
            <template x-for="o in st.options" :key="o.v">
              <button class="choice" :class="{ on: ans[st.id] === o.v }"
                      @click="ans[st.id] = o.v"><span x-text="o.label"></span></button>
            </template>
          </div>
        </template>

        <template x-if="st.type === 'multi'">
          <div class="choices">
            <template x-for="o in st.options" :key="o.id">
              <button class="choice" :class="{ on: (ans[st.id] || []).includes(o.id) }"
                      @click="toggleMulti(st.id, o.id)">
                <span><span x-text="o.label"></span><small x-text="o.d"></small></span>
              </button>
            </template>
          </div>
        </template>

        <template x-if="st.type === 'classify'">
          <div class="classify">
            <template x-for="item in lines(ans[st.from])" :key="item">
              <div class="cls-row">
                <div class="cls-item" x-text="item"></div>
                <div class="seg">
                  <template x-for="o in st.options" :key="o.v">
                    <button :class="{ on: (ans[st.id] || {})[item] === o.v, ['v-' + o.v]: true }"
                            @click="classify(st.id, item, o.v)" x-text="o.label"></button>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>

        <template x-if="st.type === 'timer'">
          <div class="breath">
            <div class="horizon">
              <div class="breath-sun" :class="breathPhase() === 'Wdech' ? 'up' : 'down'"></div>
            </div>
            <div class="breath-label" x-text="breathPhase()"></div>
            <div class="breath-sec" x-text="timer ? timer.left + ' s' : ''"></div>
            <button class="text-btn" x-show="timer" @click="stopTimer()">pomiń</button>
          </div>
        </template>

        <template x-if="st.type === 'intro'">
          <div class="intro">
            <figure class="quote">
              <blockquote>Bądź jak cypel, o który bez końca rozbijają się fale.</blockquote>
              <figcaption>Marek Aureliusz · Rozmyślania IV.49</figcaption>
            </figure>
            <div class="intro-wx" x-show="preview">
              <svg class="ic"><use :href="'#i-' + preview"/></svg>
              <span x-text="weather(preview)?.label"></span>
              <span class="muted" x-text="weather(preview)?.hint"></span>
            </div>
          </div>
        </template>

        <template x-if="st.type === 'storms'">
          <div class="swatches four">
            <template x-for="w in WEATHERS.filter(x => x.id !== 'pogodnie')" :key="w.id">
              <button class="swatch" :class="{ on: (ans.storms || []).includes(w.id) }" @click="toggleStorm(w.id)">
                <span class="orb" :style="`--a:${w.sky[0]};--b:${w.sky[1]};--c:${w.sky[2]}`">
                  <svg class="ic"><use :href="'#i-' + w.id"/></svg>
                </span>
                <span class="sw-label" x-text="w.label"></span>
                <span class="sw-hint" x-text="w.hint"></span>
              </button>
            </template>
          </div>
        </template>

        <template x-if="st.type === 'baseline'">
          <div class="baseline">
            <template x-for="b in BASELINE_ITEMS" :key="b.id">
              <div class="bl-row">
                <div class="bl-head"><span class="bl-label" x-text="b.label"></span><span class="bl-val" x-text="bl[b.id]"></span></div>
                <input type="range" min="0" max="10" step="1" x-model.number="bl[b.id]" />
                <div class="scale-ends"><span x-text="b.ends[0]"></span><span x-text="b.ends[1]"></span></div>
              </div>
            </template>
          </div>
        </template>

        <template x-if="st.type === 'habitPick'">
          <div class="choices">
            <template x-for="h in suggestedHabits()" :key="h.id">
              <div class="pick" :class="{ on: pickedHabit(h.id) }">
                <button class="choice" :class="{ on: pickedHabit(h.id) }" @click="toggleHabitPick(h)"
                        :disabled="!pickedHabit(h.id) && (ans.habits || []).length >= 3">
                  <span><span x-text="h.name"></span>
                    <small x-show="!pickedHabit(h.id)" x-text="h.for.some(w => (ans.storms || []).includes(w)) ? 'polecany przy Twoich burzach' : ''"></small></span>
                </button>
                <template x-if="pickedHabit(h.id)">
                  <div class="pick-fields">
                    <label class="label">Kotwica: po czym?<input type="text" class="field" x-model="picked(h.id).anchor" /></label>
                    <label class="label">Wersja minimum<input type="text" class="field" x-model="picked(h.id).min" /></label>
                  </div>
                </template>
              </div>
            </template>
            <p class="legend" x-text="`${(ans.habits || []).length}/3 · własne dodasz później w zakładce Nawyki`"></p>
          </div>
        </template>

        <template x-if="st.type === 'rhythm'">
          <div class="rhythm">
            <label class="time-row"><span class="row-title">Poranek</span><input type="time" class="field time" x-model="rh.morning" /></label>
            <label class="time-row"><span class="row-title">Wieczór</span><input type="time" class="field time" x-model="rh.evening" /></label>
            <h2 class="label">Przypomnienie</h2>
            <p class="lede">iOS nie pozwala Skrótom otworzyć aplikacji z ekranu początkowego, ale może o niej przypomnieć:</p>
            <ol class="steps-list">
              <li>Otwórz <b>Skróty</b> → <b>Automatyzacja</b> → <b>Nowa automatyzacja</b> → <b>Pora dnia</b>.</li>
              <li><span x-text="rh.morning"></span>, codziennie, zaznacz <b>Uruchom natychmiast</b>.</li>
              <li>Nowy pusty skrót → czynność <b>Pokaż powiadomienie</b>, treść: „Czas na poranek”.</li>
              <li>To samo na <span x-text="rh.evening"></span> z treścią „Czas na wieczór”.</li>
            </ol>
            <p class="lede small-note">Powiadomienie otwiera Skróty, nie aplikację, więc po nim stuknij ikonę Stormcalmera. Najwygodniej trzymać ją w Docku.</p>
          </div>
        </template>

        <template x-if="st.type === 'weather'">
          <div class="swatches">
            <template x-for="w in WEATHERS" :key="w.id">
              <button class="swatch" :class="{ on: ans.weather === w.id }"
                      @click="ans.weather = w.id; day().weather = w.id; save()">
                <span class="orb" :style="`--a:${w.sky[0]};--b:${w.sky[1]};--c:${w.sky[2]}`">
                  <svg class="ic"><use :href="'#i-' + w.id"/></svg>
                </span>
                <span class="sw-label" x-text="w.label"></span>
              </button>
            </template>
          </div>
        </template>
        <template x-if="st.type === 'weather' && ans.weather">
          <p class="hint center" x-text="weather(ans.weather).hint"></p>
        </template>

        <template x-if="st.type === 'habits'">
          <div class="habit-rows">
            <template x-for="h in activeHabits()" :key="h.id">
              <div class="habit-row">
                <span class="hn" x-text="h.name"></span>
                <button class="pip half" :class="{ on: habitState(h.id) === 'min' }" @click="setHabit(h.id, 'min')" aria-label="minimum"></button>
                <button class="pip" :class="{ on: habitState(h.id) === 'done' }" @click="setHabit(h.id, 'done')" aria-label="zrobione"></button>
              </div>
            </template>
            <p class="legend"><span class="pip half on"></span> minimum <span class="pip on"></span> całość</p>
          </div>
        </template>

        <button class="cta" :disabled="!canNext()" @click="next()">
          <span x-text="isTextStep() && !(ans[st.id] || '').trim() ? 'Pomiń' : (run?.i === visibleSteps().length - 1 ? 'Zakończ' : 'Dalej')"></span>
          <svg class="ic"><use href="#i-arrow"/></svg>
        </button>
      </section>
    </template>

    <!-- podsumowanie -->
    <template x-if="run?.done">
      <section class="step done">
        <p class="done-title" x-text="run?.kind === 'ritual' ? (run?.key === 'poranek' ? 'Dobrego dnia.' : 'Dzień domknięty.') : 'Zapisane.'"></p>
        <template x-if="delta(run?.answers || {}) !== null">
          <p class="delta"><span x-text="runAnswer('before')"></span><span class="arrow">→</span><span x-text="runAnswer('after')"></span></p>
        </template>
        <template x-if="delta(run?.answers || {}) < 0">
          <p class="hint center">Morze się uspokaja.</p>
        </template>
        <dl class="summary">
          <template x-for="r in run ? summary(run.def, run.answers) : []" :key="r.label">
            <div><dt x-text="r.label"></dt><dd x-text="r.value"></dd></div>
          </template>
        </dl>
        <button class="cta" @click="run = null; tab = 'dzis'"><span>Wróć</span></button>
      </section>
    </template>
  </main>
</template>

<!-- ============ ZAKŁADKI ============ -->
<template x-if="!run && !showInstall">
<main class="page">

  <!-- DZIŚ -->
  <section x-show="tab === 'dzis'" class="today">
    <header class="masthead">
      <span class="eyebrow" x-text="todayLabel()"></span>
      <template x-if="peekDay(today)?.weather">
        <span class="eyebrow wx"><svg class="ic sm"><use :href="'#i-' + peekDay(today).weather"/></svg><span x-text="weather(peekDay(today).weather).label"></span></span>
      </template>
    </header>

    <figure class="quote">
      <blockquote x-text="todayQuote().t"></blockquote>
      <figcaption><span x-text="todayQuote().a"></span> · <span x-text="todayQuote().s"></span></figcaption>
    </figure>

    <template x-if="showPort()">
      <aside class="port">
        <span class="label">Twój port</span>
        <p x-text="'„' + s.profile.goal + '”'"></p>
      </aside>
    </template>

    <template x-if="!s.profile?.onboardedAt">
      <aside class="card-note">
        <span class="label">Pierwszy rejs</span>
        <p class="card-title">Ustaw swój port</p>
        <p class="lede">Twoje najczęstsze burze, cel na miesiąc, punkt wyjścia i nawyki z kotwicami. Trzy minuty.</p>
        <button class="text-btn" @click="start('flow', 'onboarding')">Zacznij →</button>
      </aside>
    </template>

    <template x-if="currentCard()">
      <aside class="card-note" x-data="{ get c() { return currentCard() } }">
        <span class="label" x-text="'Dzień ' + (c.day + 1)"></span>
        <p class="card-title" x-text="c.title"></p>
        <p class="lede" x-text="c.body"></p>
        <div class="card-actions">
          <button class="text-btn" @click="goCard(c)" x-text="c.cta + ' →'"></button>
          <button class="text-btn muted-btn" @click="dismissCard(c)">później</button>
        </div>
      </aside>
    </template>

    <nav class="rituals">
      <button class="ritual" :class="{ done: peekDay(today)?.morningAt }" @click="start('ritual', 'poranek')">
        <span class="r-num">I</span>
        <span class="r-body"><span class="r-title">Poranek</span>
          <span class="r-sub" x-text="peekDay(today)?.morningAt ? (peekDay(today).forecast ? '„' + peekDay(today).forecast + '”' : 'zrobione') : 'pogoda · cytat · prognoza'"></span></span>
        <span class="r-meta" x-text="peekDay(today)?.morningAt ? '✓' : '1½ min'"></span>
      </button>
      <button class="ritual" :class="{ done: peekDay(today)?.eveningAt }" @click="start('ritual', 'wieczor')">
        <span class="r-num">II</span>
        <span class="r-body"><span class="r-title">Wieczór</span>
          <span class="r-sub" x-text="peekDay(today)?.eveningAt ? 'dzień domknięty' : 'przegląd Seneki · nawyki'"></span></span>
        <span class="r-meta" x-text="peekDay(today)?.eveningAt ? '✓' : '3 min'"></span>
      </button>
    </nav>

    <h2 class="label">Nawyki</h2>
    <div class="habit-rows">
      <template x-for="h in activeHabits()" :key="h.id">
        <div class="habit-row">
          <span class="hn" x-text="h.name"></span>
          <button class="pip half" :class="{ on: habitState(h.id) === 'min' }" @click="setHabit(h.id, 'min')" aria-label="minimum"></button>
          <button class="pip" :class="{ on: habitState(h.id) === 'done' }" @click="setHabit(h.id, 'done')" aria-label="zrobione"></button>
        </div>
      </template>
    </div>

    <button class="storm-btn" @click="tab = 'burza'">
      <svg class="ic"><use href="#i-wichura"/></svg><span>Burza teraz</span>
    </button>
  </section>

  <!-- BURZA -->
  <section x-show="tab === 'burza'">
    <h1 class="title">Co się dzieje?</h1>
    <div class="swatches">
      <template x-for="w in WEATHERS" :key="w.id">
        <button class="swatch" :class="{ on: sosWeather === w.id }" @click="sosWeather = w.id">
          <span class="orb" :style="`--a:${w.sky[0]};--b:${w.sky[1]};--c:${w.sky[2]}`">
            <svg class="ic"><use :href="'#i-' + w.id"/></svg>
          </span>
          <span class="sw-label" x-text="w.label"></span>
        </button>
      </template>
    </div>

    <template x-if="sosWeather">
      <div>
        <h2 class="label">Na tę pogodę</h2>
        <div class="list">
          <template x-for="k in sosList().rec" :key="k">
            <button class="row" @click="start('exercise', k)">
              <span class="row-body"><span class="row-title" x-text="EXERCISES[k].title"></span>
                <span class="row-sub" x-text="EXERCISES[k].desc"></span></span>
              <span class="row-meta" x-text="EXERCISES[k].mins + ' min'"></span>
            </button>
          </template>
        </div>
      </div>
    </template>

    <h2 class="label" x-text="sosWeather ? 'Pozostałe' : 'Wszystkie ćwiczenia'"></h2>
    <div class="list">
      <template x-for="k in (sosWeather ? sosList().rest : Object.keys(EXERCISES))" :key="k">
        <button class="row compact" @click="start('exercise', k)">
          <span class="row-body"><span class="row-title" x-text="EXERCISES[k].title"></span></span>
          <span class="row-meta" x-text="EXERCISES[k].mins + ' min'"></span>
        </button>
      </template>
    </div>

    <aside class="crisis">
      <h2 class="label">Gdy jest naprawdę źle</h2>
      <p>Ta aplikacja nie zastąpi rozmowy z człowiekiem. Możesz zadzwonić, bezpłatnie:</p>
      <a href="tel:116123"><b>116 123</b> telefon zaufania dla dorosłych</a>
      <a href="tel:800702222"><b>800 70 2222</b> Centrum Wsparcia, całą dobę</a>
      <a href="tel:112"><b>112</b> zagrożenie życia</a>
    </aside>
  </section>

  <!-- NAWYKI -->
  <section x-show="tab === 'nawyki'">
    <h1 class="title">Nawyki</h1>
    <p class="lede">Liczy się to, co zależało od Ciebie. Wersja minimum też się liczy. Pominięty dzień to informacja, nie porażka.</p>

    <div class="list">
      <template x-for="h in activeHabits()" :key="h.id">
        <button class="habit-card" @click="editHabit(h)">
          <span class="hc-top">
            <span class="row-body"><span class="row-title" x-text="h.name"></span>
              <span class="row-sub" x-text="(h.anchor ? h.anchor + ' · ' : '') + 'minimum: ' + (h.min || '—')"></span></span>
            <span class="hc-week"><b x-text="habitWeek(h.id)"></b>/7</span>
          </span>
          <span class="dots">
            <template x-for="k in lastDays(14)" :key="k">
              <span class="dot" :class="habitState(h.id, k) || ''"></span>
            </template>
          </span>
        </button>
      </template>
    </div>
    <button class="text-btn add" @click="newHabit()">+ dodaj nawyk</button>

    <template x-if="habitForm">
      <div class="sheet" @click.self="habitForm = null">
        <div class="sheet-body">
          <h2 class="title sm" x-text="habitForm.id ? 'Edytuj nawyk' : 'Nowy nawyk'"></h2>
          <label class="label">Nazwa<input type="text" class="field" x-model="habitForm.name" placeholder="np. Medytacja" /></label>
          <label class="label">Kotwica: po czym?<input type="text" class="field" x-model="habitForm.anchor" placeholder="np. po porannej kawie" /></label>
          <label class="label">Wersja minimum<input type="text" class="field" x-model="habitForm.min" placeholder="np. trzy oddechy" /></label>
          <button class="cta" @click="saveHabit()"><span>Zapisz</span></button>
          <button class="text-btn danger" x-show="habitForm.id" @click="archiveHabit()">usuń z listy (historia zostaje)</button>
        </div>
      </div>
    </template>
  </section>

  <!-- KLIMAT -->
  <section x-show="tab === 'klimat'" x-data="{ c: null, f: null, x: null }" x-effect="if (tab === 'klimat') { c = climate(); f = forecastStats(); x = sosStats() }">
    <h1 class="title">Klimat</h1>

    <div class="cal">
      <template x-for="d in ['pn','wt','śr','cz','pt','sb','nd']"><span class="cal-h" x-text="d"></span></template>
      <template x-for="cell in calendar()" :key="cell.key">
        <span class="cal-c" :class="{ future: cell.future, today: cell.key === today, has: cell.w }">
          <template x-if="cell.w">
            <span class="orb sm" :style="`--a:${weather(cell.w).sky[0]};--b:${weather(cell.w).sky[1]};--c:${weather(cell.w).sky[2]}`"></span>
          </template>
          <template x-if="!cell.w"><span class="cal-n" x-text="cell.num"></span></template>
        </span>
      </template>
    </div>

    <template x-if="c && c.logged">
      <div>
        <h2 class="label">Ostatnie 30 dni</h2>
        <div class="bars">
          <template x-for="w in WEATHERS" :key="w.id">
            <div class="bar-row">
              <span class="bar-name" x-text="w.label"></span>
              <span class="bar-track"><span class="bar-fill" :style="`width:${(c.counts[w.id] / c.max) * 100}%;background:${w.sky[2]}`"></span></span>
              <span class="bar-n" x-text="c.counts[w.id]"></span>
            </div>
          </template>
        </div>
        <template x-for="p in c.patterns" :key="p.w.id">
          <p class="insight" x-text="`${p.w.label} przychodzi najczęściej ${p.day} (${p.n}×).`"></p>
        </template>
      </div>
    </template>

    <template x-if="progressRows().length">
      <div class="figure">
        <h2 class="label">Punkt wyjścia → teraz</h2>
        <template x-for="r in progressRows()" :key="r.id">
          <div class="prog-row">
            <span class="bar-name" x-text="r.label"></span>
            <span class="prog-val"><span x-text="r.from"></span><span class="arrow">→</span><b x-text="r.to"></b></span>
          </div>
        </template>
        <p class="lede" x-show="s.profile?.goal" x-text="'Twój port: „' + s.profile.goal + '”'"></p>
      </div>
    </template>

    <template x-if="f && f.n">
      <div class="figure">
        <h2 class="label">Poranne prognozy</h2>
        <p class="big-num" x-text="f.notPct + '%'"></p>
        <p class="lede">czarnych scenariuszy się nie sprawdziło (<span x-text="f.notHappened"></span> z <span x-text="f.n"></span>).</p>
        <p class="lede" x-show="f.hitN">Gdy się sprawdziły, w <b x-text="f.lighterPct + '%'"></b> przypadków było lżej niż w wyobraźni.</p>
      </div>
    </template>

    <template x-if="x && x.n">
      <div class="figure">
        <h2 class="label">Burze</h2>
        <p class="big-num" x-text="x.avg"></p>
        <p class="lede">średnia zmiana napięcia po ćwiczeniu (<span x-text="x.n"></span> ćwiczeń).</p>
      </div>
    </template>

    <template x-if="c && !c.logged">
      <p class="lede">Tu pojawi się mapa Twojej pogody. Zacznij od porannego check-inu.</p>
    </template>

    <h2 class="label" x-show="journal().length">Dziennik</h2>
    <div class="list">
      <template x-for="e in journal()" :key="e.key">
        <div class="j-item">
          <button class="row compact" @click="openEntry = openEntry === e.key ? null : e.key">
            <span class="row-body"><span class="row-title" x-text="entryDef(e).title"></span></span>
            <span class="row-meta" x-text="fmtDate(e.ts)"></span>
          </button>
          <template x-if="openEntry === e.key">
            <dl class="summary">
              <template x-for="r in summary(entryDef(e), e.answers)" :key="r.label">
                <div><dt x-text="r.label"></dt><dd x-text="r.value"></dd></div>
              </template>
            </dl>
          </template>
        </div>
      </template>
    </div>
  </section>

  <!-- WIĘCEJ -->
  <section x-show="tab === 'wiecej'">
    <h1 class="title">Więcej</h1>

    <h2 class="label">Kopia danych</h2>
    <p class="lede">Wszystko jest zapisane tylko na tym urządzeniu. Eksportuj co jakiś czas do Plików lub iCloud. Tak też przeniesiesz dane między iPhone'em a iPadem.</p>
    <div class="list">
      <button class="row compact" @click="exportData()"><span class="row-body"><span class="row-title">Eksportuj kopię</span></span><svg class="ic"><use href="#i-arrow"/></svg></button>
      <label class="row compact"><span class="row-body"><span class="row-title">Wczytaj kopię</span></span><svg class="ic"><use href="#i-arrow"/></svg>
        <input type="file" accept="application/json,.json" @change="pickImport($event)" hidden />
      </label>
    </div>
    <p class="insight" x-show="importMsg" x-text="importMsg"></p>
    <button class="cta" x-show="pendingImport" @click="confirmImport()"><span>Zastąp dane</span></button>

    <h2 class="label">Przypomnienia</h2>
    <p class="lede" x-text="rhythmHint()"></p>

    <h2 class="label">Port i punkt wyjścia</h2>
    <div class="list">
      <button class="row compact" @click="start('flow', 'onboarding')"><span class="row-body"><span class="row-title" x-text="s.profile?.onboardedAt ? 'Powtórz pierwszy rejs' : 'Ustaw swój port'"></span></span><svg class="ic"><use href="#i-arrow"/></svg></button>
      <button class="row compact" x-show="s.profile?.onboardedAt" @click="start('flow', 'checkin')"><span class="row-body"><span class="row-title">Punkt kontrolny teraz</span></span><svg class="ic"><use href="#i-arrow"/></svg></button>
    </div>

    <aside class="crisis">
      <h2 class="label">Gdy jest naprawdę źle</h2>
      <a href="tel:116123"><b>116 123</b> telefon zaufania dla dorosłych</a>
      <a href="tel:800702222"><b>800 70 2222</b> Centrum Wsparcia, całą dobę</a>
      <a href="tel:112"><b>112</b> zagrożenie życia</a>
    </aside>

    <p class="colophon">Cytaty: Marek Aureliusz, Seneka, Epiktet, w przekładzie własnym, swobodnym. Ćwiczenia oparte na technikach CBT i praktykach stoickich. To narzędzie samopomocy, a nie terapia.</p>
  </section>

  <nav class="tabbar">
    <button :class="{ on: tab === 'dzis' }" @click="tab = 'dzis'"><svg class="ic"><use href="#i-dzis"/></svg><span>Dziś</span></button>
    <button :class="{ on: tab === 'burza' }" @click="tab = 'burza'"><svg class="ic"><use href="#i-wichura"/></svg><span>Burza</span></button>
    <button :class="{ on: tab === 'nawyki' }" @click="tab = 'nawyki'"><svg class="ic"><use href="#i-nawyki"/></svg><span>Nawyki</span></button>
    <button :class="{ on: tab === 'klimat' }" @click="tab = 'klimat'"><svg class="ic"><use href="#i-klimat"/></svg><span>Klimat</span></button>
    <button :class="{ on: tab === 'wiecej' }" @click="tab = 'wiecej'"><svg class="ic"><use href="#i-wiecej"/></svg><span>Więcej</span></button>
  </nav>
</main>
</template>

</body>
</html>
